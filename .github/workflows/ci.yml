name: Spring Boot CI/CD with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn -B package

      - name: Build Docker image
        run: docker build -t chessbuild .

      - name: Run Docker container
        run: |
          docker run -d -p 8080:8080 --name chessbuild-container chessbuild
          sleep 10
          curl -f http://localhost:8080/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessbuild-jar
          path: target/chessBuild-0.0.1-SNAPSHOT.jar

        
